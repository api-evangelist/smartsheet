aid: smartsheet
name: Smartsheet
description: Smartsheet is a SaaS work management and collaboration platform that
  combines spreadsheet-style sheets, project plans, Gantt charts, dashboards, forms,
  and workflow automation for teams and enterprises. The Smartsheet REST API provides
  programmatic access to sheets, rows, columns, reports, workspaces, users, attachments,
  and webhooks using OAuth 2.0 or API access tokens.
